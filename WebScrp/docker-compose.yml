services:
  webscrp:
    build: .
    ports:
      - "8080:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      db:
        condition: service_healthy # <--- Ждем, пока база станет здоровой
      
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-WebScrp_database}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck: # <--- Проверяем здоровье базы
      test: ["CMD-SHELL", "pg_isready -U postgres -d WebScrp_database"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
